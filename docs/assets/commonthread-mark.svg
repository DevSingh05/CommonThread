<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title description">
  <title id="title">CommonThread mark</title>
  <desc id="description">Two interwoven paths representing Claude and Codex collaborating in one shared thread.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17233d"/>
      <stop offset="1" stop-color="#2b3b61"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect x="7" y="7" width="82" height="82" rx="20" fill="url(#background)" filter="url(#shadow)"/>
  <path d="M20 34c17 0 18 28 35 28 13 0 17-16 22-28" fill="none" stroke="#f4b860" stroke-width="8" stroke-linecap="round"/>
  <path d="M20 62c17 0 18-28 35-28 13 0 17 16 22 28" fill="none" stroke="#7fb3ff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="20" cy="34" r="4" fill="#fff"/>
  <circle cx="20" cy="62" r="4" fill="#fff"/>
  <circle cx="77" cy="34" r="4" fill="#fff"/>
  <circle cx="77" cy="62" r="4" fill="#fff"/>
</svg>
